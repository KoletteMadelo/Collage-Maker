<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collage Maker</title>
    <!-- External Library for Exporting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* --- CSS VARIABLES & RESET --- */
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-secondary: #b3b3b3;
            --accent: #6200ee;
            --accent-hover: #3700b3;
            --border: #333333;
            --danger: #cf6679;
            --radius: 12px;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- LAYOUT CONTAINERS --- */
        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #bb86fc, #03dac6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .app-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* --- CONTROLS SECTION --- */
        .controls-panel {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        /* Inputs */
        input[type="file"] {
            display: none;
        }

        .file-btn {
            background-color: var(--card-bg);
            border: 2px dashed var(--border);
            padding: 15px;
            text-align: center;
            border-radius: var(--radius);
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .file-btn:hover {
            border-color: var(--accent);
            color: var(--text-main);
        }

        .layout-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
            background-color: #333;
            color: #ccc;
            flex: 1;
            text-align: center;
        }

        .btn.active {
            background-color: var(--accent);
            color: white;
        }

        .btn:hover:not(.active) {
            background-color: #444;
        }

        .btn-primary {
            background-color: var(--accent);
            color: white;
            font-size: 1rem;
            padding: 12px;
        }
        
        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-danger {
            background-color: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
        }

        .btn-danger:hover {
            background-color: rgba(207, 102, 121, 0.1);
        }

        /* Range Sliders */
        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
        }

        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #252525;
            padding: 10px;
            border-radius: 8px;
        }

        .toggle-switch {
            cursor: pointer;
        }
        
        /* Checkbox custom styling */
        .toggle-checkbox {
            appearance: none;
            width: 40px;
            height: 20px;
            background: #444;
            border-radius: 20px;
            position: relative;
            outline: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .toggle-checkbox::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            transition: 0.3s;
        }

        .toggle-checkbox:checked {
            background: var(--accent);
        }

        .toggle-checkbox:checked::after {
            left: 22px;
        }

        /* --- PREVIEW AREA --- */
        .preview-container {
            background-color: var(--card-bg);
            padding: 10px;
            border-radius: var(--radius);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
        }

        #collage-target {
            width: 100%;
            max-width: 500px; /* Visual width on screen */
            aspect-ratio: 1 / 1;
            background-color: #000;
            position: relative;
            overflow: hidden;
            border-radius: 4px; /* Slight radius for preview */
        }

        /* Grid Items */
        .grid-item {
            background-size: cover;
            background-position: center;
            position: relative;
            transition: transform 0.2s;
            cursor: grab;
        }
        
        .grid-item:active {
            cursor: grabbing;
        }

        .grid-item.dragging {
            opacity: 0.5;
            z-index: 100;
        }

        .grid-item.drag-over {
            outline: 2px solid var(--accent);
            outline-offset: -2px;
        }

        /* Overlay Styling */
        .overlay-box {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* Allow drag drop through overlay */
        }

        .counter-text {
            font-size: 4rem;
            font-weight: bold;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            user-select: none;
        }

        /* --- LOADING STATE --- */
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            display: none;
            flex-direction: column;
            gap: 15px;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-top: 5px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- RESPONSIVE --- */
        @media (max-width: 600px) {
            .btn { font-size: 0.8rem; padding: 8px 4px; }
            h1 { font-size: 1.5rem; }
            .counter-text { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Collage Maker</h1>
        <p style="color: var(--text-secondary); font-size: 0.9rem">Create beautiful layouts instantly</p>
    </header>

    <div class="app-container">
        
        <!-- Upload Section -->
        <div class="controls-panel">
            <div class="control-group">
                <label>1. Upload Images (Max 4)</label>
                <label for="file-input" class="file-btn" id="file-label">
                    Click to select images (JPG, PNG, WEBP)
                </label>
                <input type="file" id="file-input" accept="image/png, image/jpeg, image/webp" multiple>
            </div>
            <div id="preview-filenames" style="font-size: 0.8rem; color: var(--text-secondary);"></div>
        </div>

        <!-- Layout Controls -->
        <div class="controls-panel">
            <div class="control-group">
                <label>2. Choose Layout</label>
                <div class="layout-options" id="layout-buttons">
                    <!-- Dynamic buttons injected via JS or static -->
                    <button class="btn active" data-layout="2h">2 Side-by-Side</button>
                    <button class="btn" data-layout="2v">2 Vertical</button>
                    <button class="btn" data-layout="3">3 Images</button>
                    <button class="btn" data-layout="4">4 Grid</button>
                </div>
            </div>
        </div>

        <!-- Advanced Features -->
        <div class="controls-panel">
            <div class="control-group">
                <label>3. Extra Options</label>
                <div class="toggle-row">
                    <span>Show Counter Overlay</span>
                    <input type="checkbox" class="toggle-checkbox" id="overlay-toggle">
                </div>
                
                <div id="extra-controls" style="display: none; margin-top: 10px; gap: 15px; flex-direction: column;">
